<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Sorting Robot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@404;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0A0A0C; /* Very dark background */
            --bg-secondary: #1C1E22; /* Card/Panel background */
            --text-primary: #E0E6EB; /* Light gray text */
            --text-secondary: #A8B3C4; /* Muted blue-gray for secondary text */
            --accent-blue: #007ACC; /* Primary accent blue */
            --accent-green: #28A745; /* Active/Success green */
            --accent-red: #DC3545; /* Idle/Error red */
            --border-color: #33363B; /* Subtle border for inputs/dividers */
            --shadow-subtle: rgba(0, 0, 0, 0.2);
            --shadow-medium: rgba(0, 0, 0, 0.4);
            --shadow-strong: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Header & Navigation --- */
        .header {
            background-color: var(--bg-secondary);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            width: 100%;
            box-shadow: 0 4px 15px var(--shadow-strong);
            z-index: 1000;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }

        .header h1 .fas.fa-robot { /* Font Awesome robot icon */
            font-size: 36px;
            margin-right: 15px;
            color: var(--accent-blue);
        }

        .nav-bar {
            background-color: var(--bg-secondary);
            margin-top: 70px; /* Adjust based on header height */
            padding: 0 40px;
            display: flex;
            justify-content: flex-start;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0 2px 10px var(--shadow-medium);
        }

        .nav-bar a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 18px 28px;
            transition: color 0.3s ease, border-bottom 0.3s ease;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-bar a:hover {
            color: var(--text-primary);
        }

        .nav-bar a.active {
            color: var(--text-primary);
            border-bottom: 3px solid var(--accent-blue);
        }

        /* --- Main Content & Cards --- */
        .content {
            padding-top: 140px; /* Adjust based on header + nav height */
            padding: 140px 40px 80px 40px;
            max-width: 1400px; /* Limit width for large screens */
            margin: 0 auto; /* Center content */
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 20px var(--shadow-medium), 0 0 0 1px var(--border-color); /* Subtle border + shadow */
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s ease-out;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 25px var(--shadow-strong), 0 0 0 1px var(--accent-blue);
        }

        h2 {
            font-size: 24px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--accent-blue);
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 .fas {
            color: var(--text-secondary);
            font-size: 20px;
        }

        h3 {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        /* --- Home Tab Styles --- */
        #home .status-card {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .status-indicator {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.5s ease-in-out, box-shadow 0.5s ease-in-out;
        }

        .status-active {
            background-color: var(--accent-green);
            box-shadow: 0 0 20px var(--accent-green);
        }

        .status-idle {
            background-color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-red);
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .control-buttons button {
            padding: 18px 45px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
